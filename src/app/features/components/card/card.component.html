<article class="creation-card" [id]="categoryId">
  <a [routerLink]="link" [attr.aria-label]="'Voir les ' + title">
    <img [src]="image" [alt]="title" width="329" height="254" loading="lazy" />

    <span class="card-label">
      {{ title }}
      <span aria-hidden="true">→</span>
    </span>
  </a>
</article>
