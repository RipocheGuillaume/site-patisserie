<section class="creations" id="creations" aria-labelledby="creations-title">
  <h2 class="section-title" id="creations-title">Nos envies gourmandes</h2>
  @for (card of cards(); track card.description) {
    <app-card
      [title]="card.title"
      [image]="card.image"
      [description]="card.description"
      [type]="card.type"
    />
  }
</section>
