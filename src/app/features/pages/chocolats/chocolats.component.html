<section class="creations" id="creations" aria-labelledby="creations-title">
  <h2 class="section-title" id="creations-title">Nos créations chocolatées</h2>
  <h3 class="section-subtitle">
    Découvrez nos créations chocolatées et nos spécialités
  </h3>
  @for (card of cards(); track card.image) {
    <app-card
      [title]="card.title"
      [image]="card.image"
      [description]="card.description"
    />
  }
</section>
